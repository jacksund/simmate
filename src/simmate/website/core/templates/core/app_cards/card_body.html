{% load simmate_utils %}
{% comment %}
Styled card contents shared by app cards on the Apps page.
Expects: title, icon, tags (comma-separated), description, url, button_text
{% endcomment %}
<div class="card-body d-flex flex-column">
    <div class="d-flex align-items-center mb-3">
        <i class="bi {{ icon }} text-primary fs-4 me-2"></i>
        <h5 class="card-title mb-0 fw-bold text-dark">{{ title }}</h5>
    </div>
    <div class="d-flex flex-wrap gap-1 mb-3">
        {% for tag in tags|split:"," %}
            <span class="badge fw-normal bg-secondary-subtle text-secondary border border-secondary-subtle">{{ tag }}</span>
        {% endfor %}
    </div>
    <p class="text-muted small mb-3">{{ description }}</p>
    <a href="{{ url }}" class="btn btn-primary btn-sm w-100 mt-auto">
        {{ button_text }} <i class="bi bi-arrow-right ms-1"></i>
    </a>
</div>
