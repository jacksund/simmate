<div class="tab-pane show active" id="overview-section">
    <div class="row">
        <div class="col-md-6">
            <div class="card mb-4 shadow-sm">
                <div class="card-header bg-light">
                    <h5 class="mb-0">User Details</h5>
                </div>
                <div class="card-body">
                    <table class="table table-sm table-borderless mb-0">
                        <tbody>
                            <tr>
                                <th scope="row" class="text-muted" style="width: 30%;">Username</th>
                                <td>{{ user.username }}</td>
                            </tr>
                            <tr>
                                <th scope="row" class="text-muted">First Name</th>
                                <td>{{ user.first_name|default:"---" }}</td>
                            </tr>
                            <tr>
                                <th scope="row" class="text-muted">Last Name</th>
                                <td>{{ user.last_name|default:"---" }}</td>
                            </tr>
                            <tr>
                                <th scope="row" class="text-muted">Email</th>
                                <td>{{ user.email|default:"---" }}</td>
                            </tr>
                            <tr>
                                <th scope="row" class="text-muted">Joined</th>
                                <td>{{ user.date_joined|date:"F d, Y" }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
