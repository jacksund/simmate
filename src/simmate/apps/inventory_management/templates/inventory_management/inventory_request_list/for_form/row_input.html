{# A text box for one cell of a new list's table, showing the `shared_value` used when it is left blank. Numbers and dates are text boxes too, as browsers clear invalid values of number and date inputs instead of posting them #}
<input class="form-control form-control-sm"
       type="text"
       name="{{ name }}"
       value="{{ value }}"
       placeholder="{{ shared_value|default:'' }}">
