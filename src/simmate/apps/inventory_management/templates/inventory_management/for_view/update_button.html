{# The button to update the entry, aligned to the right end of a tab bar #}
{% user_can table_entry "update" as can_update %}
{% if can_update %}
    <a role="button"
       class="btn btn-warning btn-sm"
       href="{% url 'data_explorer:table-entry-update' table_entry.table_name table_entry.id %}">Update <i class="bi bi-pencil"></i></a>
{% endif %}
